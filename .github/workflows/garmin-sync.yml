name: Garmin to Google Sheets Sync

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Novosibirsk, утро: сон и пульс за ночь
    - cron: '0 1 * * *'
    # 14:00 UTC = 21:00 Asia/Novosibirsk, вечер: тренировка уже в Garmin
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: ~/.garth
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Run sync script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GARMIN_TOKEN_DIR: ~/.garth
          SYNC_TIMEZONE: Asia/Novosibirsk
          SYNC_START_DATE: '2026-01-01'
        run: python sync_garmin.py

      - name: Save Garmin tokens
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.garth
          key: garmin-tokens-${{ github.run_id }}
