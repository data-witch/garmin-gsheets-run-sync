name: Garmin to Google Sheets Sync

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC = 11:00 Asia/Novosibirsk
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: ~/.garth
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Run sync script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GARMIN_TOKEN_DIR: ~/.garth
          SYNC_TIMEZONE: Asia/Novosibirsk
        run: python sync_garmin.py

      - name: Save Garmin tokens
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.garth
          key: garmin-tokens-${{ github.run_id }}
